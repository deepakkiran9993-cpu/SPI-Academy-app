<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPI Academy Admin</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:white;padding:18px;margin:14px 0;border-radius:14px;box-shadow:0 3px 15px #0001}input,select,textarea,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #ccc}button{background:#111827;color:white}textarea{width:95%}.hide{display:none}</style></head><body><div class="wrap"><div class="card"><h1>SPI Academy Bhopal — Admin</h1><p>Question Bank Management</p></div><div id="login" class="card"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="m"></p><small>Demo/local password gate. Real secure login requires Supabase Auth.</small></div><div id="app" class="hide"><div class="card"><h2>Add Question</h2><input id="cl" placeholder="Class"><input id="st" placeholder="Stream"><input id="su" placeholder="Subject"><input id="ch" placeholder="Chapter"><select id="tc"><option>A</option><option>B</option><option>C</option></select><br><textarea id="qe" placeholder="Question English"></textarea><br><textarea id="qh" placeholder="Question Hindi"></textarea><br><input id="o0" placeholder="Option 1 EN"><input id="h0" placeholder="विकल्प 1"><input id="o1" placeholder="Option 2 EN"><input id="h1" placeholder="विकल्प 2"><input id="o2" placeholder="Option 3 EN"><input id="h2" placeholder="विकल्प 3"><input id="o3" placeholder="Option 4 EN"><input id="h3" placeholder="विकल्प 4"><br><input id="ans" type="number" min="0" max="3" placeholder="Correct 0-3"><button onclick="add()">Add Question</button><button onclick="exportQ()">Export questions.json</button><p id="ok"></p></div><div class="card"><h2>Questions</h2><div id="list"></div></div></div></div><script>
const PASS="SPI2026";let bank=[];fetch("questions.json").then(r=>r.json()).then(x=>{bank=x;show()});
function login(){if(pw.value===PASS){document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide")}else m.textContent="Wrong password"}
function add(){bank.push({class_no:+cl.value,stream:st.value||null,subject:su.value,chapter:ch.value,test_code:tc.value,question_en:qe.value,question_hi:qh.value,options_en:[o0.value,o1.value,o2.value,o3.value],options_hi:[h0.value,h1.value,h2.value,h3.value],answer_index:+ans.value,marks:1});ok.textContent="Question added locally. Export and replace questions.json to publish.";show()}
function show(){list.innerHTML=bank.slice().reverse().map(q=>"<p>"+q.class_no+" • "+q.subject+" • "+q.chapter+" • "+q.question_en+"</p>").join("")}
function exportQ(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(bank,null,2)],{type:"application/json"}));a.download="questions.json";a.click()}
</script></body></html>
